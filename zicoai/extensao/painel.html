<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ZicoAI</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #f2f2f2; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .barra { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid #262626; }
  .barra button, .con button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #4a3c12; background: #1c1706; color: #F4CB63; font-weight: 600; font-size: 14px; cursor: pointer; }
  .barra button:active, .con button:active { transform: scale(.98); }
  #aviso { font-size: 12px; color: #9a9a9a; padding: 0 10px 6px; min-height: 0; }
  details.con { border-bottom: 1px solid #262626; padding: 6px 10px; font-size: 13px; }
  details.con summary { cursor: pointer; color: #cfcfcf; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.con summary::-webkit-details-marker { display: none; }
  .bola { width: 8px; height: 8px; border-radius: 50%; background: #6b6b6b; display: inline-block; }
  .bola.ok { background: #3ecf6a; }
  .con label { display: block; margin: 8px 0 3px; color: #9a9a9a; font-size: 12px; }
  .con input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid #333; background: #141414; color: #f2f2f2; font-size: 13px; }
  .con .linha { display: flex; gap: 8px; margin-top: 8px; }
  .con .fraco { background: #141414; border-color: #333; color: #bdbdbd; }
  .con p { color: #9a9a9a; font-size: 12px; margin: 6px 0 0; line-height: 1.4; }
  iframe { flex: 1; width: 100%; border: 0; }
</style>
</head>
<body>
  <details class="con" id="con">
    <summary><span class="bola" id="bola"></span><span id="estado">Conectar a ZicoAI ao Chrome</span></summary>
    <label for="segredo">Segredo do Chrome (o mesmo da propriedade PONTE_SEGREDO_NAV)</label>
    <input id="segredo" type="password" autocomplete="off" placeholder="cole aqui">
    <label for="url">Link do cérebro (deixe como está)</label>
    <input id="url" type="url" autocomplete="off">
    <div class="linha">
      <button id="salvar">Conectar</button>
      <button id="desligar" class="fraco">Desligar</button>
    </div>
    <p>Com isso a ZicoAI consegue ler o site aberto, achar erros, tirar print, clicar e preencher quando vc pedir. Ela nunca preenche senha, cartão, CPF ou conta, não mexe em banco/pagamento e só aperta botão de comprar/enviar/apagar com o seu OK.</p>
  </details>
  <div class="barra">
    <button id="usar" title="Manda o texto da página aberta pra ZicoAI">📄 Usar esta página</button>
    <button id="trecho" title="Manda só o trecho que vc selecionou">✂️ Usar trecho selecionado</button>
  </div>
  <div id="aviso"></div>
  <iframe id="app" src="https://thiagogaldinozicao-source.github.io/zicoai/?ext=1" allow="microphone; clipboard-write"></iframe>
  <script src="painel.js"></script>
</body>
</html>
