<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>ZicoAI</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZicoAI">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#0a0a0a; --lado:#0f0f0f; --card:#151515; --card2:#1d1d1d; --borda:#262626; --borda2:#333;
  --ouro:#EBB533; --ouro2:#F4CB63; --ouro-fundo:#1c1706; --txt:#f2f2f2; --cinza:#9a9a9a; --cinza2:#6f6f6f;
  --verde:#5fd068; --erro:#ff6b6b; --lado-w:290px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Barlow',system-ui,sans-serif;font-size:16px}
body{display:flex;height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
a{color:var(--ouro2)}

/* ---------- lateral (conversas) ---------- */
#lado{width:var(--lado-w);flex-shrink:0;background:var(--lado);border-right:1px solid var(--borda);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.lado-top{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;line-height:1}
.logo b{color:var(--ouro);font-weight:400}
.novo{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px;border-radius:12px;background:var(--ouro);color:#111;font-weight:700}
.novo:active{transform:scale(.98)}
.lado-tit{font-size:12px;color:var(--cinza2);text-transform:uppercase;letter-spacing:.08em;padding:10px 16px 6px}
#lista{flex:1;overflow-y:auto;padding:0 8px 10px}
.chat-item{display:flex;align-items:center;gap:6px;padding:10px;border-radius:10px;color:#d8d8d8;font-size:15px}
.chat-item:hover{background:var(--card)}
.chat-item.ativo{background:var(--card2);color:#fff}
.chat-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.chat-item .x{opacity:0;color:var(--cinza);width:26px;height:26px;border-radius:7px;flex-shrink:0}
.chat-item:hover .x,.chat-item.ativo .x{opacity:1}
.chat-item .x:hover{color:var(--erro);background:#2a1414}
.lado-pe{border-top:1px solid var(--borda);padding:10px 8px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:2px}
.lado-pe button{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;font-size:15px;text-align:left}
.lado-pe button:hover{background:var(--card)}
.lado-vazio{color:var(--cinza2);font-size:14px;padding:10px}

/* ---------- área principal ---------- */
#principal{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:none;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--borda)}
.btn-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.btn-ic:active{background:var(--card)}
header .titulo{flex:1;min-width:0;text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--cinza)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--cinza2)}
.status.on i{background:var(--verde)}
.status.off i{background:var(--erro)}

#chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.trilho{max-width:820px;margin:0 auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:18px}

.boas{min-height:60dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.boas h2{font-family:'Bebas Neue';font-weight:400;font-size:46px;letter-spacing:1px;color:var(--ouro)}
.boas p{color:var(--cinza);max-width:360px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px;width:100%;max-width:520px}
.sug{padding:12px;border:1px solid var(--borda);border-radius:14px;background:var(--card);font-size:14px;text-align:left;line-height:1.3}
.sug b{display:block;color:var(--ouro2);font-weight:600;margin-bottom:2px}
.sug:active{border-color:var(--ouro)}

.msg-eu{align-self:flex-end;max-width:85%;background:var(--card2);border:1px solid var(--borda2);padding:10px 14px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;word-wrap:break-word;line-height:1.5}
.msg-eu img{display:block;max-width:230px;width:100%;border-radius:12px;margin-bottom:8px}

.msg-ia{display:flex;gap:10px;align-items:flex-start}
.ava{width:30px;height:30px;border-radius:9px;background:#0a0a0a url(ava.png) center/cover;border:1px solid #3a2f0d;flex-shrink:0;margin-top:2px}
.corpo{flex:1;min-width:0;line-height:1.6;overflow-wrap:anywhere}
.corpo.erro .md{color:var(--erro)}

/* como respondi */
.passos{margin-bottom:8px}
.passos summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--cinza);padding:3px 0}
.passos summary::-webkit-details-marker{display:none}
.passos summary::before{content:'▸';font-size:11px;transition:transform .15s}
.passos[open] summary::before{transform:rotate(90deg)}
.passos ol{list-style:none;margin:6px 0 4px 4px;border-left:2px solid var(--borda2);padding-left:12px}
.passos li{position:relative;font-size:13px;color:var(--cinza);padding:3px 0}
.passos li::before{content:'';position:absolute;left:-17px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--borda2)}
.passos li:last-child::before{background:var(--ouro)}

/* trabalhando */
.trab ol{list-style:none;border-left:2px solid var(--borda2);padding-left:12px;margin:2px 0 0 4px}
.trab li{position:relative;font-size:14px;color:var(--cinza2);padding:4px 0;transition:color .3s}
.trab li::before{content:'';position:absolute;left:-17px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--borda2)}
.trab li.feito{color:var(--cinza)}
.trab li.feito::before{background:var(--cinza)}
.trab li.agora{color:var(--txt)}
.trab li.agora::before{background:var(--ouro);box-shadow:0 0 0 4px rgba(235,181,51,.2);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.4}}

/* markdown */
.md>*:first-child{margin-top:0}
.md p{margin:0 0 10px}
.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{font-family:'Barlow';font-weight:700;margin:16px 0 8px;line-height:1.3}
.md h1{font-size:21px}.md h2{font-size:19px}.md h3,.md h4{font-size:17px;color:var(--ouro2)}
.md strong{color:#fff;font-weight:700}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:3px 0}
.md li::marker{color:var(--ouro)}
.md blockquote{border-left:3px solid var(--ouro);padding:4px 12px;color:#ccc;margin:0 0 10px;background:var(--card)}
.md hr{border:none;border-top:1px solid var(--borda2);margin:14px 0}
.md code{background:#232323;border:1px solid var(--borda2);padding:1px 6px;border-radius:6px;font-size:.88em;font-family:ui-monospace,Menlo,Consolas,monospace}
.md table{border-collapse:collapse;margin:0 0 12px;font-size:14px;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--borda2);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--card2);color:var(--ouro2)}
.md tr:nth-child(even) td{background:#121212}
.md img{max-width:100%;border-radius:14px;border:1px solid var(--borda2);display:block}

.bloco{background:#0d0d0d;border:1px solid var(--ouro);border-radius:14px;margin:4px 0 12px;overflow:hidden}
.bloco-top{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 12px;background:var(--ouro-fundo);font-size:12px;color:var(--ouro);text-transform:lowercase}
.copiar{background:var(--ouro);color:#111;font-weight:700;font-size:13px;padding:7px 14px;border-radius:9px}
.copiar.ok{background:var(--verde)}
.bloco pre{padding:12px 14px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5;white-space:pre-wrap;color:#eee;margin:0}
.bloco pre code{background:none;border:none;padding:0;font-size:inherit}

.img-gerada{margin:4px 0 12px;max-width:420px}
.img-gerada .carrega{aspect-ratio:1;border-radius:14px;border:1px dashed var(--ouro);display:grid;place-items:center;color:var(--cinza);font-size:14px;background:var(--card)}
.img-gerada .abrir{display:inline-block;margin-top:6px;font-size:13px}

.acoes-msg{display:flex;gap:4px;margin-top:6px;align-items:center;flex-wrap:wrap}
.acoes-msg button{font-size:13px;color:var(--cinza);padding:5px 9px;border-radius:8px;display:inline-flex;gap:5px;align-items:center}
.acoes-msg button:hover{background:var(--card);color:var(--txt)}
.acoes-msg .info{font-size:12px;color:var(--cinza2);margin-left:4px}
.acoes-msg .tag{font-size:12px;color:var(--ouro);margin-left:4px}

/* ---------- caixa de mensagem ---------- */
footer{padding:8px 12px calc(env(safe-area-inset-bottom) + 10px)}
.caixa{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--borda2);border-radius:22px;padding:8px}
.caixa:focus-within{border-color:#4a3c12}
#previa{display:none;padding:4px 4px 8px;gap:8px;align-items:center}
#previa img{height:64px;border-radius:12px;border:1px solid var(--ouro)}
#previa button{font-size:13px;color:var(--erro);padding:4px 8px}
textarea{width:100%;resize:none;max-height:200px;min-height:26px;background:transparent;color:var(--txt);border:none;padding:6px 8px;font:inherit;font-size:16px;outline:none;line-height:1.45}
.caixa-pe{display:flex;align-items:center;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:20px;border:1px solid var(--borda2);font-size:13px;color:var(--cinza)}
.chip.on{border-color:var(--ouro);color:var(--ouro);background:var(--ouro-fundo)}
.chip-ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--borda2);display:grid;place-items:center;font-size:17px}
.sel-wrap{position:relative;margin-left:auto}
.sel{display:inline-flex;align-items:center;gap:4px;padding:7px 10px;border-radius:10px;font-size:13px;color:var(--cinza)}
.sel:hover{background:var(--card2);color:var(--txt)}
.sel b{color:var(--txt);font-weight:600}
.menu{display:none;position:absolute;right:0;bottom:44px;width:250px;background:var(--card2);border:1px solid var(--borda2);border-radius:14px;padding:6px;z-index:15;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu.aberto{display:block}
.menu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:10px}
.menu button:hover{background:var(--card)}
.menu button b{display:block;font-size:14px;font-weight:600}
.menu button span{display:block;font-size:12px;color:var(--cinza)}
.menu button.on b::after{content:' ✓';color:var(--ouro)}
.enviar{width:38px;height:38px;border-radius:50%;background:var(--ouro);color:#111;font-size:18px;font-weight:700;display:grid;place-items:center}
.enviar:disabled{opacity:.35}
.enviar.parar{background:#fff}
.enviar.parar span{width:12px;height:12px;background:#111;border-radius:2px;display:block}
.dica{max-width:820px;margin:6px auto 0;text-align:center;font-size:11px;color:var(--cinza2)}

/* ---------- janelas ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.aberto{display:flex}
.painel{background:var(--card);width:100%;max-width:520px;border-radius:20px;padding:20px 18px;border:1px solid var(--borda2);max-height:88dvh;overflow-y:auto}
.painel h3{font-family:'Bebas Neue';font-weight:400;font-size:30px;color:var(--ouro);letter-spacing:1px;margin-bottom:6px}
.painel label{display:block;font-size:13px;color:var(--cinza);margin:14px 0 5px}
.painel input,.painel select{width:100%;background:var(--bg);border:1px solid var(--borda2);color:var(--txt);padding:12px;border-radius:12px;font:inherit;font-size:16px;outline:none}
.painel input:focus,.painel select:focus{border-color:var(--ouro)}
.linha-btn{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:15px}
.btn.ouro{background:var(--ouro);color:#111}
.btn.cinza{background:var(--card2);border:1px solid var(--borda2)}
.aviso{font-size:14px;margin-top:10px;min-height:18px;color:var(--cinza)}
.sec{font-family:'Bebas Neue';font-size:21px;color:var(--ouro2);margin:18px 0 4px;letter-spacing:.5px}
.mem-item{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid var(--borda);font-size:14px;line-height:1.4}
.mem-item div{flex:1}
.mem-item small{color:var(--cinza2);display:block;font-size:12px}
.mem-item .x{color:var(--cinza);width:30px;height:30px;border-radius:8px;flex-shrink:0}
.mem-item .x:hover{color:var(--erro);background:#2a1414}
.certo{color:var(--verde)}.errado{color:var(--erro)}

#veu{display:none}

@media (max-width:899px){
  #lado{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .22s ease;width:min(84vw,320px)}
  body.lado-aberto #lado{transform:none}
  body.lado-aberto #veu{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:19}
  header{display:flex}
  .lado-top .logo{display:block}
}
@media (max-width:420px){ .sugs{grid-template-columns:1fr} .chip .rot{display:none} .chip{padding:7px 10px} }
</style>
</head>
<body>

<aside id="lado">
  <div class="lado-top">
    <div class="logo">ZICO<b>AI</b></div>
    <button class="novo" id="bNovo">＋ Nova conversa</button>
  </div>
  <div class="lado-tit">Conversas</div>
  <div id="lista"><div class="lado-vazio">Carregando...</div></div>
  <div class="lado-pe">
    <button id="bMem">🧠 Memória</button>
    <button id="bCfg">⚙️ Configurar <span class="status" id="status" style="margin-left:auto"><i></i><span>—</span></span></button>
  </div>
</aside>
<div id="veu"></div>

<div id="principal">
  <header>
    <button class="btn-ic" id="bMenu" aria-label="Conversas">☰</button>
    <div class="titulo" id="tituloTopo">ZicoAI</div>
    <button class="btn-ic" id="bNovo2" aria-label="Nova conversa">✎</button>
  </header>

  <main id="chat"><div class="trilho" id="trilho"></div></main>

  <footer>
    <div class="caixa">
      <div id="previa"><img id="previaImg" alt=""><button id="tiraFoto">✕ remover foto</button></div>
      <textarea id="txt" rows="1" placeholder="Pergunta qualquer coisa pra ZicoAI"></textarea>
      <div class="caixa-pe">
        <button class="chip-ic" id="bFoto" title="Foto">📷</button>
        <input type="file" id="arquivo" accept="image/*" hidden>
        <button class="chip" id="cWeb" title="Pesquisar na web">🌐<span class="rot"> Pesquisar</span></button>
        <button class="chip" id="cImg" title="Gerar imagem">🎨<span class="rot"> Imagem</span></button>
        <div class="sel-wrap">
          <button class="sel" id="bModelo"><b id="nomeModelo">Auto</b> ▾</button>
          <div class="menu" id="menuModelo">
            <button data-c="auto"><b>Auto</b><span>PC quando tiver ligado, senão a nuvem</span></button>
            <button data-c="gemini"><b>Gemini</b><span>Textos grandes, fotos e pesquisa no Google</span></button>
            <button data-c="groq"><b>Groq</b><span>Muito rápido, forte em programação</span></button>
            <button data-c="pc"><b>PC de casa</b><span>Modelo do seu PC (se tiver desligado, usa a nuvem)</span></button>
          </div>
        </div>
        <button class="enviar" id="bEnviar" aria-label="Enviar">➤</button>
      </div>
    </div>
    <div class="dica">A ZicoAI aprende com vc. Não mande CPF nem telefone de cliente aqui.</div>
  </footer>
</div>

<div class="modal" id="mCfg">
  <div class="painel">
    <h3>Configurar</h3>
    <label>Link do script (termina com /exec)</label>
    <input id="cUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label>PIN</label>
    <input id="cPin" type="password" autocomplete="off">
    <label>Nome deste aparelho</label>
    <input id="cAparelho" placeholder="iPhone, PC, Mac...">
    <div class="aviso" id="cAviso"></div>
    <div class="linha-btn">
      <button class="btn cinza" id="cTestar">Testar</button>
      <button class="btn ouro" id="cSalvar">Salvar</button>
    </div>
  </div>
</div>

<div class="modal" id="mMem">
  <div class="painel">
    <h3>Memória da ZicoAI</h3>
    <label>Ensinar algo novo</label>
    <input id="mNovo" placeholder="Ex.: o frete da Will agora é 15%">
    <div class="linha-btn"><button class="btn ouro" id="mSalvar">Salvar na memória</button></div>
    <div class="aviso" id="mAviso"></div>
    <div id="mLista"></div>
    <div class="linha-btn"><button class="btn cinza" id="mFechar">Fechar</button></div>
  </div>
</div>

<script>
/* =========================================================
   ZicoAI - app (fala com o script do Google)
   ========================================================= */
const $ = id => document.getElementById(id);
const LS = {
  get(k, p){ try{ const v = localStorage.getItem('zicoai_' + k); return v === null ? p : JSON.parse(v); }catch(e){ return p; } },
  set(k, v){ try{ localStorage.setItem('zicoai_' + k, JSON.stringify(v)); }catch(e){} }
};

let cfg = Object.assign({ url:'', pin:'', aparelho:'', cerebro:'auto', pcUrl:'http://localhost:11434', pcModelo:'zicoai' }, LS.get('cfg', {}));
let chats = LS.get('chats', []);            // [{id,titulo,atualizada}]
let atual = LS.get('atual', null);          // id da conversa aberta
let mensagens = LS.get('msgs_' + atual, []);
let foto = null, miniatura = null;
let modo = 'auto';
let controle = null;                        // pra botão parar

/* ---------- servidor ---------- */
async function api(corpo, sinal){
  if(!cfg.url || !cfg.pin) throw new Error('Configura o link e o PIN em ⚙️ Configurar');
  const r = await fetch(cfg.url, {
    method:'POST',
    body: JSON.stringify(Object.assign({ pin: cfg.pin, aparelho: cfg.aparelho || 'app' }, corpo)),
    signal: sinal
  });
  const t = await r.text();
  let j;
  try{ j = JSON.parse(t); }catch(e){ throw new Error('O script não respondeu direito. Confere se publicou com acesso "Qualquer pessoa".'); }
  if(!j.ok){ const er = new Error(j.erro || 'Erro desconhecido'); er.passos = j.passos; throw er; }
  return j;
}
function status(ok){
  const s = $('status');
  s.className = 'status' + (ok === true ? ' on' : ok === false ? ' off' : '');
  s.querySelector('span').textContent = !cfg.url ? 'falta' : ok === false ? 'offline' : 'online';
}

/* ---------- texto formatado ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let renderMd;
if(window.marked && window.DOMPurify){
  const r = new marked.Renderer();
  r.code = function(code, lang){
    if(code && typeof code === 'object'){ lang = code.lang; code = code.text; }
    const l = String(lang || '').trim().split(/\s/)[0] || 'texto';
    return '<div class="bloco"><div class="bloco-top"><span>' + esc(l) + '</span><button class="copiar" type="button">Copiar</button></div><pre><code>' + esc(code) + '</code></pre></div>';
  };
  marked.setOptions({ renderer: r, gfm: true, breaks: true });
  DOMPurify.addHook('afterSanitizeAttributes', n => { if(n.tagName === 'A'){ n.setAttribute('target','_blank'); n.setAttribute('rel','noopener'); } });
  renderMd = t => DOMPurify.sanitize(marked.parse(t));
} else {
  // reserva simples se as bibliotecas não carregarem
  renderMd = t => t.split(/```([^\n`]*)\n?([\s\S]*?)```/g).map((p, i) => {
    if(i % 3 === 0) return p.trim() ? '<p>' + esc(p.trim()).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>') + '</p>' : '';
    if(i % 3 === 1) return '';
    return '<div class="bloco"><div class="bloco-top"><span>texto</span><button class="copiar" type="button">Copiar</button></div><pre><code>' + esc(p) + '</code></pre></div>';
  }).join('');
}
function trataImagens(el){
  el.querySelectorAll('.md img').forEach(img => {
    if(img.closest('.img-gerada')) return;
    const caixa = document.createElement('div');
    caixa.className = 'img-gerada';
    const carrega = document.createElement('div');
    carrega.className = 'carrega';
    carrega.textContent = '🎨 Gerando imagem...';
    img.replaceWith(caixa);
    caixa.appendChild(carrega);
    const nova = new Image();
    nova.alt = 'imagem gerada';
    nova.onload = () => {
      carrega.replaceWith(nova);
      const a = document.createElement('a');
      a.href = nova.src; a.target = '_blank'; a.rel = 'noopener'; a.className = 'abrir';
      a.textContent = 'Abrir em tamanho cheio (segura o dedo pra salvar)';
      caixa.appendChild(a);
    };
    nova.onerror = () => { carrega.textContent = 'Não consegui gerar agora. Tenta de novo daqui a pouco, ou gera no PC pelo ComfyUI.'; };
    nova.src = img.src;
  });
}

/* ---------- copiar ---------- */
function copiar(txt, botao, rotulo){
  const ok = () => { if(!botao) return; const o = botao.innerHTML; botao.textContent = 'Copiado ✓'; botao.classList.add('ok'); setTimeout(() => { botao.innerHTML = o; botao.classList.remove('ok'); }, 1500); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(ok).catch(() => velho()); }
  else velho();
  function velho(){
    const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); ok(); }catch(e){} t.remove();
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('.copiar');
  if(b) copiar(b.closest('.bloco').querySelector('pre').textContent, b);
});

/* ---------- conversas (lateral) ---------- */
function desenhaLista(){
  const l = $('lista');
  if(!chats.length){ l.innerHTML = '<div class="lado-vazio">Nenhuma conversa ainda.</div>'; return; }
  l.innerHTML = '';
  chats.forEach(c => {
    const d = document.createElement('div');
    d.className = 'chat-item' + (c.id === atual ? ' ativo' : '');
    d.innerHTML = '<button class="t"></button><button class="x" title="Apagar">🗑</button>';
    d.querySelector('.t').textContent = c.titulo || 'Conversa';
    d.querySelector('.t').onclick = () => abrir(c.id);
    d.querySelector('.x').onclick = () => apagar(c.id);
    l.appendChild(d);
  });
}
async function carregaLista(){
  try{ const j = await api({ acao:'chats' }); chats = j.chats; LS.set('chats', chats); desenhaLista(); status(true); }
  catch(e){ desenhaLista(); status(false); }
}
async function abrir(id){
  fechaLado();
  if(controle) return;
  atual = id; LS.set('atual', atual);
  mensagens = LS.get('msgs_' + id, []);
  desenha(); desenhaLista();
  try{
    const j = await api({ acao:'abrir', chatId: id });
    if(atual !== id) return;
    // mantém fotos e passos que só existem neste aparelho
    const locais = mensagens;
    mensagens = j.mensagens.map((m, i) => Object.assign({}, locais[i] && locais[i].content === m.content ? locais[i] : {}, m));
    LS.set('msgs_' + id, mensagens);
    desenha();
  }catch(e){ status(false); }
}
async function apagar(id){
  if(!confirm('Apagar essa conversa? (o que a ZicoAI aprendeu continua salvo)')) return;
  chats = chats.filter(c => c.id !== id); LS.set('chats', chats);
  try{ localStorage.removeItem('zicoai_msgs_' + id); }catch(e){}
  if(atual === id) novaConversa();
  desenhaLista();
  try{ await api({ acao:'apagarChat', chatId: id }); }catch(e){}
}
function novaConversa(){
  if(controle) return;
  atual = null; mensagens = []; LS.set('atual', null);
  desenha(); desenhaLista(); fechaLado(); $('txt').focus();
}

/* ---------- tela da conversa ---------- */
function desenha(){
  const t = $('trilho');
  t.innerHTML = '';
  const c = chats.find(x => x.id === atual);
  $('tituloTopo').textContent = c ? c.titulo : 'ZicoAI';
  if(!mensagens.length){
    t.innerHTML = '<div class="boas"><h2>E aí, Thiago</h2><p>Pergunta, manda foto, pede pesquisa ou imagem. Tudo que eu aprender fica salvo no cel e no PC.</p><div class="sugs">' +
      [['Ficha técnica','Compara iPhone 15 Pro com 16 Pro pra cliente'],
       ['Cálculo','12x de 2.500 no PagBank, quanto fica?'],
       ['Cliente','Resposta pra cliente pedindo desconto à vista'],
       ['Pesquisa','Pesquisa a cotação do dólar hoje']]
      .map(s => '<button class="sug"><b>' + s[0] + '</b>' + s[1] + '</button>').join('') + '</div></div>';
    t.querySelectorAll('.sug').forEach(b => b.onclick = () => { $('txt').value = b.childNodes[1].textContent; envia(); });
    return;
  }
  mensagens.forEach((m, i) => t.appendChild(balao(m, i === mensagens.length - 1)));
  rola();
}
function balao(m, ultima){
  if(m.role === 'user'){
    const d = document.createElement('div');
    d.className = 'msg-eu';
    if(m.foto){ const i = document.createElement('img'); i.src = m.foto; d.appendChild(i); }
    d.appendChild(document.createTextNode(m.content.replace(/\n\[📷 foto enviada\]$/, '')));
    return d;
  }
  const d = document.createElement('div');
  d.className = 'msg-ia';
  d.innerHTML = '<div class="ava"></div><div class="corpo' + (m.erro ? ' erro' : '') + '"></div>';
  const corpo = d.querySelector('.corpo');
  if(m.passos && m.passos.length){
    const det = document.createElement('details');
    det.className = 'passos';
    det.innerHTML = '<summary>Como respondi</summary><ol>' + m.passos.map(p => '<li>' + esc(p) + '</li>').join('') + '</ol>';
    corpo.appendChild(det);
  }
  const md = document.createElement('div');
  md.className = 'md';
  md.innerHTML = renderMd(m.content);
  corpo.appendChild(md);
  trataImagens(corpo);

  const ac = document.createElement('div');
  ac.className = 'acoes-msg';
  if(!m.erro){
    const bc = document.createElement('button'); bc.innerHTML = '⧉ Copiar';
    bc.onclick = () => copiar(m.content.replace(/\n\n\*\*Fontes:\*\*[\s\S]*$/, ''), bc);
    ac.appendChild(bc);
  }
  if(ultima){
    const br = document.createElement('button'); br.innerHTML = '↻ Refazer';
    br.onclick = () => refazer();
    ac.appendChild(br);
  }
  if(m.cerebro){ const s = document.createElement('span'); s.className = 'info'; s.textContent = m.cerebro; ac.appendChild(s); }
  if(m.salvou && m.salvou.length){ const s = document.createElement('span'); s.className = 'tag'; s.textContent = '🧠 ' + m.salvou.join(', '); ac.appendChild(s); }
  corpo.appendChild(ac);
  return d;
}
function rola(){ const c = $('chat'); requestAnimationFrame(() => c.scrollTop = c.scrollHeight); }

/* ---------- "trabalhando" (etapas enquanto espera) ---------- */
function mostraTrabalhando(etapas){
  const d = document.createElement('div');
  d.className = 'msg-ia trab';
  d.innerHTML = '<div class="ava"></div><div class="corpo"><ol>' + etapas.map(e => '<li>' + esc(e) + '</li>').join('') + '</ol></div>';
  $('trilho').appendChild(d); rola();
  const itens = d.querySelectorAll('li');
  let i = 0;
  itens[0].classList.add('agora');
  const tempos = [900, 1400, 2200, 3500, 5000];
  let tmr;
  (function proximo(){
    tmr = setTimeout(() => {
      if(i >= itens.length - 1) return;
      itens[i].classList.remove('agora'); itens[i].classList.add('feito');
      i++; itens[i].classList.add('agora');
      proximo();
    }, tempos[Math.min(i, tempos.length - 1)]);
  })();
  return () => { clearTimeout(tmr); d.remove(); };
}
function etapasPara(texto, temFoto){
  const e = ['Lendo seu perfil e a memória'];
  if(temFoto) e.push('Olhando a foto');
  if(modo === 'web' || /pesquis|cota[cç][aã]o|d[oó]lar hoje|not[ií]cia|na internet|no google|pre[cç]o atual/i.test(texto)) e.push('Pesquisando na web', 'Conferindo as fontes');
  if(modo === 'imagem' || /(cri|ger|faz|desenh)\w* (uma )?(imagem|foto|arte|logo|desenho)/i.test(texto)) e.push('Montando a imagem');
  if(/c[oó]digo|html|python|unreal|script|programa|\bapp\b/i.test(texto)) e.push('Escrevendo o código');
  if(cfg.cerebro !== 'gemini' && cfg.cerebro !== 'groq' && modo === 'auto') e.push('Vendo se o PC tá ligado');
  e.push('Escrevendo a resposta');
  return e;
}

/* ---------- enviar ---------- */
async function envia(refazendo){
  if(controle) return;
  const texto = $('txt').value.trim();
  if(!refazendo && !texto && !foto) return;

  let fotoEnvio = null;
  if(!refazendo){
    const m = { role:'user', content: texto || 'O que tem nessa foto?' };
    if(foto){ m.foto = miniatura; fotoEnvio = foto; }
    mensagens.push(m);
    $('txt').value = ''; ajusta(); tiraFoto();
  }
  const ultimaPerg = [...mensagens].reverse().find(m => m.role === 'user');
  desenha();
  const para = mostraTrabalhando(etapasPara(ultimaPerg.content, !!fotoEnvio));
  modoEnviando(true);

  const novo = !atual;
  try{
    const hist = mensagens.filter(m => !m.erro).slice(-12).map(m => ({ role: m.role, content: m.content }));
    const j = await api({
      acao:'chat', chatId: atual || undefined, mensagens: hist,
      imagem: fotoEnvio || undefined, modo, cerebro: cfg.cerebro, refazer: !!refazendo
    }, controle.signal);
    para();
    if(novo && j.chatId){
      atual = j.chatId; LS.set('atual', atual);
      chats.unshift({ id: j.chatId, titulo: j.titulo || 'Conversa', atualizada: '' });
    } else {
      const c = chats.find(x => x.id === atual);
      if(c){ chats = [c].concat(chats.filter(x => x !== c)); }
    }
    LS.set('chats', chats);
    mensagens.push({ role:'assistant', content: j.resposta, cerebro: j.cerebro, salvou: j.salvou, passos: j.passos });
    status(true);
  }catch(e){
    para();
    const parou = e.name === 'AbortError';
    mensagens.push({ role:'assistant', erro:true, passos: e.passos,
      content: parou ? 'Parei. (Se ela já tinha começado, a resposta aparece quando vc abrir a conversa de novo.)' : '⚠️ ' + e.message });
    if(!parou) status(false);
  }
  modoEnviando(false);
  if(modo === 'imagem') setModo('auto');
  guarda(); desenha(); desenhaLista();
}
function refazer(){
  if(controle) return;
  while(mensagens.length && mensagens[mensagens.length - 1].role === 'assistant') mensagens.pop();
  if(!mensagens.length) return;
  envia(true);
}
function modoEnviando(sim){
  const b = $('bEnviar');
  if(sim){ controle = new AbortController(); b.classList.add('parar'); b.innerHTML = '<span></span>'; b.setAttribute('aria-label','Parar'); }
  else { controle = null; b.classList.remove('parar'); b.textContent = '➤'; b.setAttribute('aria-label','Enviar'); }
}
$('bEnviar').onclick = () => { if(controle) controle.abort(); else envia(); };
function guarda(){
  if(!atual) return;
  // fotos só ficam neste aparelho e em tamanho pequeno
  LS.set('msgs_' + atual, mensagens.slice(-80));
}

/* ---------- modos ---------- */
function setModo(m){
  modo = modo === m ? 'auto' : m;
  $('cWeb').classList.toggle('on', modo === 'web');
  $('cImg').classList.toggle('on', modo === 'imagem');
  $('txt').placeholder = modo === 'web' ? 'O que vc quer pesquisar?' : modo === 'imagem' ? 'Descreve a imagem que vc quer' : 'Pergunta qualquer coisa pra ZicoAI';
  $('txt').focus();
}
$('cWeb').onclick = () => setModo('web');
$('cImg').onclick = () => setModo('imagem');

/* ---------- seletor de cérebro ---------- */
const NOMES = { auto:'Auto', gemini:'Gemini', groq:'Groq', pc:'PC de casa' };
function mostraModelo(){
  $('nomeModelo').textContent = NOMES[cfg.cerebro] || 'Auto';
  document.querySelectorAll('#menuModelo button').forEach(b => b.classList.toggle('on', b.dataset.c === cfg.cerebro));
}
$('bModelo').onclick = e => { e.stopPropagation(); $('menuModelo').classList.toggle('aberto'); };
document.querySelectorAll('#menuModelo button').forEach(b => b.onclick = () => {
  cfg.cerebro = b.dataset.c; LS.set('cfg', cfg); mostraModelo(); $('menuModelo').classList.remove('aberto');
});
document.addEventListener('click', e => { if(!e.target.closest('.sel-wrap')) $('menuModelo').classList.remove('aberto'); });

/* ---------- foto ---------- */
$('bFoto').onclick = () => $('arquivo').click();
$('arquivo').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    foto = reduz(img, 1600, 0.85);
    miniatura = reduz(img, 360, 0.7);
    URL.revokeObjectURL(url);
    $('previaImg').src = miniatura;
    $('previa').style.display = 'flex';
  };
  img.onerror = () => alert('Não consegui abrir essa foto.');
  img.src = url;
};
function reduz(img, max, q){
  let w = img.naturalWidth, h = img.naturalHeight;
  if(Math.max(w, h) > max){ const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(img, 0, 0, w, h);
  return cv.toDataURL('image/jpeg', q);
}
function tiraFoto(){ foto = null; miniatura = null; $('previa').style.display = 'none'; }
$('tiraFoto').onclick = tiraFoto;

/* ---------- caixa de texto ---------- */
function ajusta(){ const t = $('txt'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; }
$('txt').addEventListener('input', ajusta);
$('txt').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer:fine)').matches){ e.preventDefault(); envia(); }
});
// colar print direto (PC)
$('txt').addEventListener('paste', e => {
  const it = [...(e.clipboardData && e.clipboardData.items || [])].find(i => i.type.startsWith('image/'));
  if(!it) return;
  e.preventDefault();
  const f = it.getAsFile(); const dt = new DataTransfer(); dt.items.add(f);
  $('arquivo').files = dt.files; $('arquivo').onchange({ target: $('arquivo') });
});

/* ---------- lateral no celular ---------- */
function fechaLado(){ document.body.classList.remove('lado-aberto'); }
$('bMenu').onclick = () => { document.body.classList.add('lado-aberto'); carregaLista(); };
$('veu').onclick = fechaLado;
$('bNovo').onclick = novaConversa;
$('bNovo2').onclick = novaConversa;

/* ---------- configurar ---------- */
$('bCfg').onclick = () => {
  fechaLado();
  $('cUrl').value = cfg.url; $('cPin').value = cfg.pin; $('cAparelho').value = cfg.aparelho;
  $('cAviso').textContent = ''; $('mCfg').classList.add('aberto');
};
const lerCfg = () => Object.assign({}, cfg, {
  url: $('cUrl').value.trim(), pin: $('cPin').value.trim(), aparelho: $('cAparelho').value.trim() || 'app'
});
$('cTestar').onclick = async () => {
  const antes = cfg; cfg = lerCfg();
  $('cAviso').style.color = 'var(--cinza)'; $('cAviso').textContent = 'Testando...';
  try{ const j = await api({ acao:'teste' }); $('cAviso').style.color = 'var(--verde)'; $('cAviso').textContent = j.msg; }
  catch(e){ $('cAviso').style.color = 'var(--erro)'; $('cAviso').textContent = e.message; }
  cfg = antes;
};
$('cSalvar').onclick = () => { cfg = lerCfg(); LS.set('cfg', cfg); $('mCfg').classList.remove('aberto'); status(); carregaLista(); };

/* ---------- memória ---------- */
async function abreMemoria(){
  fechaLado();
  $('mMem').classList.add('aberto');
  $('mAviso').textContent = ''; $('mLista').innerHTML = '<p class="aviso">Carregando...</p>';
  try{
    const j = await api({ acao:'memorias' });
    const lista = $('mLista'); lista.innerHTML = '';
    const s1 = document.createElement('div'); s1.className = 'sec'; s1.textContent = 'O que ela lembra (' + j.memorias.length + ')'; lista.appendChild(s1);
    if(!j.memorias.length) lista.insertAdjacentHTML('beforeend', '<p class="aviso">Nada ainda. Fala "lembra que..." numa conversa ou escreve aqui em cima.</p>');
    j.memorias.forEach(l => {
      const d = document.createElement('div'); d.className = 'mem-item';
      d.innerHTML = '<div><small>' + esc(l[0]) + ' · ' + esc(l[2] || '') + '</small>' + esc(l[1]) + '</div><button class="x" title="Esquecer">🗑</button>';
      d.querySelector('.x').onclick = async () => {
        if(!confirm('Esquecer isso?')) return;
        d.style.opacity = '.4';
        try{ await api({ acao:'apagarMemoria', texto: l[1] }); d.remove(); }catch(e){ d.style.opacity = '1'; alert(e.message); }
      };
      lista.appendChild(d);
    });
    const s2 = document.createElement('div'); s2.className = 'sec'; s2.textContent = 'Erros que ela não repete mais (' + j.aprendizados.length + ')'; lista.appendChild(s2);
    j.aprendizados.forEach(l => lista.insertAdjacentHTML('beforeend',
      '<div class="mem-item"><div><small>' + esc(l[0]) + '</small><span class="errado">✗ ' + esc(l[1]) + '</span><br><span class="certo">✓ ' + esc(l[2]) + '</span></div></div>'));
  }catch(e){ $('mLista').innerHTML = '<p class="aviso" style="color:var(--erro)">' + esc(e.message) + '</p>'; }
}
$('bMem').onclick = abreMemoria;
$('mSalvar').onclick = async () => {
  const t = $('mNovo').value.trim(); if(!t) return;
  $('mAviso').style.color = 'var(--cinza)'; $('mAviso').textContent = 'Salvando...';
  try{ const j = await api({ acao:'salvar', texto: t }); $('mNovo').value = ''; await abreMemoria(); $('mAviso').style.color = 'var(--verde)'; $('mAviso').textContent = j.msg; }
  catch(e){ $('mAviso').style.color = 'var(--erro)'; $('mAviso').textContent = e.message; }
};
$('mFechar').onclick = () => $('mMem').classList.remove('aberto');
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if(e.target === m) m.classList.remove('aberto'); }));

/* ---------- início ---------- */
// link de instalação: ...zicoai/#script=URL_DO_SCRIPT (preenche o link sozinho, só falta o PIN)
(function(){
  const m = location.hash.match(/script=([^&]+)/);
  if(!m) return;
  try{
    const u = decodeURIComponent(m[1]);
    if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){ cfg.url = u; LS.set('cfg', cfg); }
  }catch(e){}
  history.replaceState(null, '', location.pathname);
  if(!cfg.pin) setTimeout(() => { $('bCfg').onclick(); $('cPin').focus(); }, 350);
})();
status();
mostraModelo();
desenhaLista();
desenha();
if(cfg.url){ carregaLista(); if(atual) abrir(atual); }
else setTimeout(() => $('bCfg').onclick(), 300);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
