name: Gerar APK da Cinemoteca
on:
  push:
    paths: ["apk/build.txt", ".github/workflows/apk.yml", "apk/gera.js"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Gera projeto
        run: |
          cd apk && npm i --no-save @bubblewrap/core@1 && VC=$(cat build.txt) node gera.js
      - name: Compila
        run: |
          cd apk/twa && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -q
      - name: Assina (chave nova a cada build, só a parte pública fica no repo)
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          P=$(openssl rand -hex 16)
          keytool -genkeypair -keystore k.jks -alias cinemoteca -keyalg RSA -keysize 2048 -validity 10000 -storepass $P -keypass $P -dname "CN=Cinemoteca"
          U=$(ls apk/twa/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$U" al.apk
          $BT/apksigner sign --ks k.jks --ks-pass pass:$P --key-pass pass:$P --out cinemoteca.apk al.apk
          FP=$(keytool -list -keystore k.jks -storepass $P -alias cinemoteca | grep -o 'SHA-256): .*' | cut -d' ' -f2)
          [ -n "$FP" ] || FP=$(keytool -list -v -keystore k.jks -storepass $P -alias cinemoteca | grep 'SHA256:' | awk '{print $2}')
          echo "FP=$FP"
          node -e '
            const fs=require("fs"),f=".well-known/assetlinks.json",fp=process.argv[1];
            let a=JSON.parse(fs.readFileSync(f,"utf8"));
            let e=a.find(x=>x.target&&x.target.package_name==="io.github.thiagogaldinozicao_source.cinemoteca");
            if(!e){e={relation:["delegate_permission/common.handle_all_urls"],target:{namespace:"android_app",package_name:"io.github.thiagogaldinozicao_source.cinemoteca",sha256_cert_fingerprints:[]}};a.push(e);}
            if(!e.target.sha256_cert_fingerprints.includes(fp))e.target.sha256_cert_fingerprints.push(fp);
            fs.writeFileSync(f,JSON.stringify(a,null,2)+"\n");' "$FP"
          rm -f k.jks al.apk
      - name: Publica
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add cinemoteca.apk .well-known/assetlinks.json && git commit -m "APK gerado" && git push
